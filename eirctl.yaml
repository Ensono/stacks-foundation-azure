import:
  - ./build/eirctl/contexts.yaml
  - ./build/eirctl/tasks.yaml

pipelines:
  build:
    - task: build:clean
    - task: terraform:docs
      depends_on: build:clean
    - task: docs:docbook
      depends_on: terraform:docs
    - task: docs:markdown
      depends_on: docs:docbook
    - task: build:copy
      depends_on: docs:markdown
    - task: build:package
      depends_on: build:copy

  docs:
    - task: docs:generate

  tests:
    - task: terraform:init
    - task: terraform:tests
      depends_on: terraform:init

  release:
    - task: build:number
    - task: github:release
      depends_on:
        - build:number

  precommit-run:
    - task: install:prek
      condition: if [ -z "$(ls -A .eirctl/bin/prek* 2>/dev/null)" ]; then exit 0; else exit 1; fi;
    - task: precommit:run
      depends_on:
        - install:prek
