contexts:
  powershell:
    container:
      name: ensono/eir-foundation-powershell
      shell: pwsh
      shell_args:
        - -Command
    envfile:
      exclude:
        - sourceversionmessage
        - posh_azure_subscription

  infra:
    container:
      name: ensono/eir-infrastructure
      shell: pwsh
      shell_args:
        - -Command
    envfile:
      exclude:
        - sourceversionmessage
        - posh_azure_subscription

  asciidoc:
    container:
      name: ensono/eir-asciidoctor
      shell: pwsh
      shell_args:
        - -Command
    envfile:
      exclude:
        - sourceversionmessage
        - posh_azure_subscription

  prek:
    container:
      name: docker.io/alpine/git:v2.54.0
      pull_timeout: 0
      entrypoint: ["/usr/bin/env"]
      shell: sh
      shell_args:
        - -c
